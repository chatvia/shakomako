<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Shakomako</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B9BFF"/>
      <stop offset="0.55" stop-color="#1E62F0"/>
      <stop offset="1" stop-color="#1638B8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="128" cy="0" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A1F66" flood-opacity="0.30"/>
    </filter>

    <!-- The bubble that speaks: body plus a tail at the bottom left. -->
    <path id="front" d="M146 184H282A64 64 0 0 1 346 248V320A64 64 0 0 1 282 384H190C160 384 128 396 96 416C88 421 80 416 82 407C86 388 82 364 82 336V248A64 64 0 0 1 146 184Z"/>
    <!-- The bubble that replies: body plus a tail at the bottom right. -->
    <path id="back" d="M254 96H358A60 60 0 0 1 418 156V221C418 246 414 268 418 285C420 293 413 297 405 293C377 275 348 264 321 264H254A60 60 0 0 1 194 204V156A60 60 0 0 1 254 96Z"/>

    <!-- Cuts a gap around the front bubble out of the back bubble. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <use href="#front" fill="#000000" stroke="#000000" stroke-width="32" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <use href="#back" fill="#FFFFFF" fill-opacity="0.42" mask="url(#gap)"/>

  <g filter="url(#lift)">
    <use href="#front" fill="#FFFFFF"/>
  </g>

  <g fill="url(#tile)">
    <circle cx="154" cy="284" r="20"/>
    <circle cx="214" cy="284" r="20"/>
    <circle cx="274" cy="284" r="20"/>
  </g>
</svg>
