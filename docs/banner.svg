<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
    <title id="title">Shakomako</title>
    <defs>
        <!-- The logo's blues, plus a cyan and the dark theme's violet, drifting across the word. -->
        <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%">
                <animate attributeName="stop-color" values="#3B9BFF;#22D3EE;#1E62F0;#7C3AED;#1638B8;#3B9BFF" dur="6s" repeatCount="indefinite" />
            </stop>
            <stop offset="25%">
                <animate attributeName="stop-color" values="#1638B8;#3B9BFF;#22D3EE;#1E62F0;#7C3AED;#1638B8" dur="6s" repeatCount="indefinite" />
            </stop>
            <stop offset="50%">
                <animate attributeName="stop-color" values="#7C3AED;#1638B8;#3B9BFF;#22D3EE;#1E62F0;#7C3AED" dur="6s" repeatCount="indefinite" />
            </stop>
            <stop offset="75%">
                <animate attributeName="stop-color" values="#1E62F0;#7C3AED;#1638B8;#3B9BFF;#22D3EE;#1E62F0" dur="6s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%">
                <animate attributeName="stop-color" values="#22D3EE;#1E62F0;#7C3AED;#1638B8;#3B9BFF;#22D3EE" dur="6s" repeatCount="indefinite" />
            </stop>
        </linearGradient>
        <mask id="softStripes">
            <rect width="100%" height="100%" fill="white" />
            <g fill="black" opacity="0.3">
                <rect y="52" width="100%" height="3" />
                <rect y="62" width="100%" height="3" />
                <rect y="72" width="100%" height="3" />
                <rect y="82" width="100%" height="3" />
            </g>
        </mask>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <text
            x="50%"
            y="86"
            text-anchor="middle"
            font-size="88"
            font-style="italic"
            font-weight="700"
            letter-spacing="-1.5"
            font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif"
            fill="url(#flow)"
            mask="url(#softStripes)"
            filter="url(#softGlow)"
            transform="skewX(-6)"
    >
        Shakomako
    </text>
</svg>
